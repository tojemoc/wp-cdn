name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Typecheck worker
        working-directory: worker
        run: npm ci && npm run typecheck

      - name: Worker self-check
        working-directory: worker
        run: npm test

      - name: Build worker bundle
        working-directory: worker
        run: npm run build

      - name: Package plugin
        run: |
          zip -r simple-cdn.zip simple-cdn
          cp worker/dist/index.js simple-cdn-worker.js

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            simple-cdn.zip
            simple-cdn-worker.js

  # Disabled by default. To auto-deploy the worker on every tag, create a
  # repository variable DEPLOY_WORKER=true and a secret CLOUDFLARE_API_TOKEN.
  deploy:
    if: startsWith(github.ref, 'refs/tags/') && vars.DEPLOY_WORKER == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm ci && npx wrangler deploy
